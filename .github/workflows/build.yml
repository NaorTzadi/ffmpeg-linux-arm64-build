name: build
on:
  workflow_dispatch:
jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble kernel archive
        run: |
          cat source/linux-5.15-split-* > source/linux-5.15.tar.xz
          rm source/linux-5.15-split-*
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          docker buildx build --build-context source=source --build-arg MANYLINUX_ARCH=aarch64 --build-arg MAKEJ=$(nproc) --output type=local,dest=out build
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-8.1.2-linux-arm64
          path: out/
